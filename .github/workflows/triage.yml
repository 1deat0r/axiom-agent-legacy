name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: decide
        run: |
          gh issue view "${{ github.event.issue.number }}" --json labels \
            | npx --yes tsx@4.23.1 packages/coding-agent/src/core/gh-tooling/triage-cli.ts \
            > /tmp/decision.json
          echo "action=$(jq -r .action /tmp/decision.json)" >> "$GITHUB_OUTPUT"
          echo "label=$(jq -r .label /tmp/decision.json)" >> "$GITHUB_OUTPUT"
      - name: Apply role label
        if: steps.decide.outputs.action == 'needs-triage'
        run: gh issue edit "${{ github.event.issue.number }}" --add-label "${{ steps.decide.outputs.label }}"
      - name: Post readiness contract
        if: steps.decide.outputs.action == 'needs-triage'
        run: |
          jq -r .comment /tmp/decision.json \
            | gh issue comment "${{ github.event.issue.number }}" --body-file -
