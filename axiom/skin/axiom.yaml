  banner_border: "#1f4d3a"
  banner_title: "#9df2c9"
  banner_accent: "#35d694"
  banner_dim: "#5e8272"
  banner_text: "#d6f2e4"
  ui_accent: "#35d694"
  ui_primary: "#9df2c9"
  ui_label: "#6fe3b0"
  ui_text: "#d6f2e4"
  ui_border: "#1f4d3a"
  ui_ok: "#3ecf8e"
  ui_error: "#ff7b72"
  ui_warn: "#f0b429"
  ui_tool: "#35d694"
  ui_thinking: "#6fe3b0"
  prompt: "#d6f2e4"
  input_rule: "#1f4d3a"
  response_border: "#35d694"
  shell_dollar: "#35d694"
