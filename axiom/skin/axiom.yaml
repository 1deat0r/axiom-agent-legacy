branding:
  agent_name: "Axiom"
  icon: "◈"
  tagline: "Sovereign agent · keeper of the garden"
  attribution: "Axiom"
  welcome: "Axiom — sovereign agent, keeper of the garden. Type your message or /help."
  goodbye: "Axiom stands down."
  response_label: " ◈ Axiom "
  prompt_symbol: "∴"
  help_header: "∴ Commands"

tool_prefix: "┆"

spinner:
  waiting_faces: ["(∴)", "(◈)", "(◇)", "(○)", "(⊕)"]
  thinking_faces: ["(∴)", "(◈)", "(◇)", "(∀)", "(λ)"]
  thinking_verbs:
    - "deriving"
    - "deducing"
    - "proving"
    - "tending"
    - "cultivating"
    - "harvesting"
    - "verifying"
    - "reasoning"
  wings:
    - ["⟪∴", "∴⟫"]
    - ["⟪◈", "◈⟫"]
    - ["⟪◇", "◇⟫"]
    - ["⟪·", "·⟫"]

