<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Axiom-agent personal mark (original design, space/futuristic-tech).
  Concept: a BEACON — concentric square (diamond) signal rings radiating out
  from a solid axiom core: the gateway beaming you status from every project.
  Square corners throughout (miter joins / butt caps).

  Brand: axiom green #2fd58a on the dark badge #0e1117; thin outline #2a3342.
-->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- square badge -->
  <rect x="44" y="44" width="424" height="424" fill="#0e1117"
        stroke="#2a3342" stroke-width="8"/>
  <!-- outer signal ring (diamond) -->
  <path d="M256 106 L406 256 L256 406 L106 256 Z"
        stroke="#2fd58a" stroke-width="16" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- inner signal ring (diamond) -->
  <path d="M256 186 L330 256 L256 326 L182 256 Z"
        stroke="#2fd58a" stroke-width="10" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- axiom core -->
  <path d="M256 236 L278 256 L256 276 L234 256 Z" fill="#2fd58a"/>
</svg>
